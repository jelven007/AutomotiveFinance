<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- TSP favicon — 方案 0 品牌渐变版 (#A78BFA→#7C3AED)
       32 网格小尺寸优化: 线幅加粗 (括号 3 / 影线 2.5@70%); 亮端朝上, 明暗标签页均可读 -->
  <defs>
    <linearGradient id="tsp-fav" x1="4" y1="3" x2="28" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- 左方括号 -->
  <path d="M10 4 L4 4 L4 28 L10 28" stroke="url(#tsp-fav)" stroke-width="3" stroke-linejoin="miter"/>
  <!-- 右方括号 -->
  <path d="M22 4 L28 4 L28 28 L22 28" stroke="url(#tsp-fav)" stroke-width="3" stroke-linejoin="miter"/>
  <!-- K 线 wick(上下影) -->
  <line x1="16" y1="7" x2="16" y2="25" stroke="url(#tsp-fav)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- K 线 body -->
  <rect x="12.5" y="9" width="7" height="10" fill="url(#tsp-fav)" rx="0.5"/>
</svg>
