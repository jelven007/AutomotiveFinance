[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "tsp-rustdx-native"
version = "0.1.0"
requires-python = ">=3.11"
description = "TSP native bridge for rustdx-complete"
license = { text = "MIT" }

[tool.maturin]
bindings = "pyo3"
module-name = "tsp_rustdx_native"
features = ["pyo3/extension-module"]
