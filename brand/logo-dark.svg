     与 logo.svg 同几何, 仅渐变换为深底优化亮度 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="TSP">
  <defs>
    <linearGradient id="tsp-grad-dark" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <path d="M20 9 H11 V55 H20" stroke="url(#tsp-grad-dark)" stroke-width="5" stroke-linejoin="miter" stroke-linecap="butt"/>
  <path d="M44 9 H53 V55 H44" stroke="url(#tsp-grad-dark)" stroke-width="5" stroke-linejoin="miter" stroke-linecap="butt"/>
  <line x1="32" y1="15" x2="32" y2="49" stroke="url(#tsp-grad-dark)" stroke-width="3.5" stroke-linecap="butt" stroke-opacity="0.55"/>
  <rect x="26.5" y="19.5" width="11" height="17" fill="url(#tsp-grad-dark)"/>
